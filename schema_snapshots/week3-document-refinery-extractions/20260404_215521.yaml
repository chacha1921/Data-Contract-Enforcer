          max: 0.95
          mean: 0.90023
          p25: 0.9
          p50: 0.9
          p75: 0.9
          std: 0.003384
          p95: 0.9
          p99: 0.9
        minimum: 0.0
        maximum: 1.0
      fact_type:
        type: string
        required: true
        description: 'Semantic type assigned to each extracted fact item. Sample values:
          text_block.'
        metrics: &id027
          dtype: object
          null_fraction: 0.0
          cardinality: 1
          dominant_character_pattern: AAAA_AAAAA
          min: null
          max: null
          mean: null
          std: null
          p95: null
          p99: null
        enum: &id028
        - text_block
      value:
        type: string
        required: true
        description: 'Extracted fact payload captured from document content. Sample
          values: አባሪ 3. የኦዲት ግኝት መረጃ አመላካች


          መረጃ ሰጪው፡- የኢትዮጵያ ኢ..., ወጪ 3

          3.1 ሁኔታ:- በጀት ዓመቱን ሳይጠብቅ ተከፍሎ የተገኘ ሂሳብ

          3..., ከላይ ከተራ ቁጥር 1 እስከ 5 ከተገለጹት በስተቀር በእኛ አስተያ የሂሣ....'
        metrics: &id029
          dtype: float64
          null_fraction: 0.0
          cardinality: 410
          dominant_character_pattern:  AAAAAAAA AA AAAAAAA, AAAAAAAA
          min: null
          max: null
          mean: null
          std: null
          p95: null
          p99: null
quality:
  type: SodaChecks
  specification:
    checks for extractions:
    - '- row_count >= 1'
    - '- missing_count(block_id) = 0'
    - '- missing_count(block_type) = 0'
    - '- missing_count(doc_id) = 0'
    - '- missing_count(domain_hint) = 0'
    - '- missing_count(language) = 0'
    - '- missing_count(language_confidence) = 0'
    - '- min(language_confidence) >= 0.0'
    - '- max(language_confidence) <= 1.0'
    - '- avg(language_confidence) >= 0.0'
    - '- avg(language_confidence) <= 1.0'
    - '- missing_count(layout_complexity) = 0'
    - '- missing_count(origin_type) = 0'
    - '- missing_count(page_number) = 0'
    - '- min(page_number) >= 1.0'
    - '- max(page_number) <= 60.0'
    - '- missing_count(processed_at) = 0'
    - '- missing_count(processing_time_seconds) = 0'
    - '- min(processing_time_seconds) >= 38.539'
    - '- max(processing_time_seconds) <= 63.7209'
    - '- missing_count(source_doc_id) = 0'
    - '- missing_count(status) = 0'
    - '- missing_count(strategy_used) = 0'
    - '- missing_count(text_length) = 0'
    - '- min(text_length) >= 1.0'
    - '- max(text_length) <= 1035.0'
    - '- missing_count(text_preview) = 0'
    - '- missing_count(extracted_facts__confidence) = 0'
    - '- min(extracted_facts__confidence) >= 0.0'
    - '- max(extracted_facts__confidence) <= 1.0'
    - '- avg(extracted_facts__confidence) >= 0.0'
    - '- avg(extracted_facts__confidence) <= 1.0'
    - '- missing_count(extracted_facts__fact_type) = 0'
    - '- missing_count(extracted_facts__value) = 0'
lineage:
  source: outputs/week3/extractions.jsonl
  lineage_snapshot: outputs/week4/lineage_snapshots.jsonl
  registry: contract_registry/subscriptions.yaml
  upstream: []
  downstream:
  - id: week4-cartographer
    description: Confidence drives downstream ranking and a 0.0-1.0 to 0-100 scale
      shift breaks ordering.; Used as the primary identifier in downstream lineage
      and enrichment flows.
    fields_consumed:
    - doc_id
    - extracted_facts
    - source_doc_id
    breaking_if_changed:
    - extracted_facts.confidence
    - doc_id
    validation_mode: ENFORCE
  downstream_consumers_from_graph:
  - node_id: analytics_invoice_quality
    relationship: LINKED
  - node_id: dbt_week3_extractions_model
    relationship: LINKED
profiling:
  engine: ydata-profiling
  columns_profiled: 20
  rows_profiled: 652
  generated: true
llm_annotations:
- field: status
  plain_english_description: 'status represented as string. Null fraction 0.000; distinct
    values 1. Sample values: success.'
  validation_expression: status must remain semantically consistent within contract
    week3-document-refinery-extractions.
  cross_column_relationship: Review alongside adjacent metadata columns during contract
    review.
  source: heuristic_fallback
- field: extracted_facts__value
  plain_english_description: 'Extracted fact payload captured from document content.
    Sample values: አባሪ 3. የኦዲት ግኝት መረጃ አመላካች


