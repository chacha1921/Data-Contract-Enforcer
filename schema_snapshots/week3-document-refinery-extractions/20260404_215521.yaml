kind: DataContract
apiVersion: v3.0.0
dataContractSpecification: 1.1.0
id: week3-document-refinery-extractions
info:
  title: Week 3 Document Refinery — Extraction Records
  version: 1.0.0
  description: One record per processed document containing extracted facts and metadata.
  owner: week3-team
servers:
  local:
    type: local
    path: outputs/week3/extractions.jsonl
    format: jsonl
terms:
  usage: Internal inter-system data contract. Do not publish.
  limitations: confidence must remain in 0.0–1.0 float range.
schema:
  block_id:
    type: string
    required: true
    description: 'Identifier for the extracted page block or OCR segment. Sample values:
      vision_text_1, vision_text_2, vision_text_3.'
    metrics: &id001
      dtype: object
      null_fraction: 0.0
      cardinality: 652
      dominant_character_pattern: AAAAAA_AAAA_99999999999
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
    unique: true
  block_type:
    type: string
    required: true
    description: 'Block classification emitted by the extraction pipeline. Sample
      values: text.'
    metrics: &id002
      dtype: object
      null_fraction: 0.0
      cardinality: 1
      dominant_character_pattern: AAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id003
    - text
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  doc_id:
    type: string
    required: true
    description: 'Document identifier for the extracted source document. Sample values:
      2013-E.C-Audit-finding-information, tax_expenditure_ethiopia_2021_22.'
    metrics: &id004
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAA_AAAAAAAAAAA_AAAAAAAA_9999_99
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id005
    - 2013-E.C-Audit-finding-information
    - tax_expenditure_ethiopia_2021_22
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
    - week4-cartographer
  domain_hint:
    type: string
    required: true
    description: 'domain_hint represented as string. Null fraction 0.000; distinct
      values 2. Sample values: general, financial.'
    metrics: &id006
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id007
    - financial
    - general
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  language:
    type: string
    required: true
    description: 'Detected language code for the extracted block. Sample values: am,
      en.'
    metrics: &id008
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id009
    - am
    - en
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  language_confidence:
    type: number
    required: true
    description: Confidence score. MUST be float 0.0-1.0. 0-100 scale is a breaking
      change.
    metrics: &id010
      dtype: float64
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: null
      min: 0.9
      max: 1.0
      mean: 0.99954
      p25: 1.0
      p50: 1.0
      p75: 1.0
      std: 0.006768
      p95: 1.0
      p99: 1.0
    minimum: 0.0
    maximum: 1.0
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
    quality_flags:
    - mean_above_0_99_possible_clamped_distribution
  layout_complexity:
    type: string
    required: true
    description: 'layout_complexity represented as string. Null fraction 0.000; distinct
      values 2. Sample values: single_column, table_heavy.'
    metrics: &id011
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAA_AAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id012
    - single_column
    - table_heavy
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  origin_type:
    type: string
    required: true
    description: 'origin_type represented as string. Null fraction 0.000; distinct
      values 2. Sample values: scanned_image, native_digital.'
    metrics: &id013
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAAA_AAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id014
    - native_digital
    - scanned_image
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  page_number:
    type: integer
    required: true
    description: 'page_number represented as integer. Null fraction 0.000; distinct
      values 60. Sample values: 1, 2, 3. Observed range 1.0 to 60.0; mean 29.455521;
      p25 16.0; p50 29.0; p75 44.0; std 15.604767; p95 56.45; p99 59.0.'
    metrics: &id015
      dtype: int64
      null_fraction: 0.0
      cardinality: 60
      dominant_character_pattern: null
      min: 1.0
      max: 60.0
      mean: 29.455521
      p25: 16.0
      p50: 29.0
      p75: 44.0
      std: 15.604767
      p95: 56.45
      p99: 59.0
    minimum: 1.0
    maximum: 60.0
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  processed_at:
    type: string
    required: true
    description: 'processed_at represented as string. Null fraction 0.000; distinct
      values 2. Sample values: 2026-03-07T20:02:37.191264, 2026-03-08T02:29:56.247097.'
    metrics: &id016
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: 9999-99-99A99:99:99.999999
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    format: date-time
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  processing_time_seconds:
    type: number
    required: true
    description: 'processing_time_seconds represented as number. Null fraction 0.000;
      distinct values 2. Sample values: 63.7209, 38.539. Observed range 38.539 to
      63.7209; mean 38.654868; p25 38.539; p50 38.539; p75 38.539; std 1.704213; p95
      38.539; p99 38.539.'
    metrics: &id017
      dtype: float64
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: null
      min: 38.539
      max: 63.7209
      mean: 38.654868
      p25: 38.539
      p50: 38.539
      p75: 38.539
      std: 1.704213
      p95: 38.539
      p99: 38.539
    minimum: 38.539
    maximum: 63.7209
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  source_doc_id:
    type: string
    required: true
    description: 'Original source document identifier carried into the extraction
      output. Sample values: 2013-E.C-Audit-finding-information, tax_expenditure_ethiopia_2021_22.'
    metrics: &id018
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAA_AAAAAAAAAAA_AAAAAAAA_9999_99
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id019
    - 2013-E.C-Audit-finding-information
    - tax_expenditure_ethiopia_2021_22
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
    - week4-cartographer
  status:
    type: string
    required: true
    description: 'status represented as string. Null fraction 0.000; distinct values
      1. Sample values: success.'
    metrics: &id020
      dtype: object
      null_fraction: 0.0
      cardinality: 1
      dominant_character_pattern: AAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id021
    - success
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  strategy_used:
    type: string
    required: true
    description: 'strategy_used represented as string. Null fraction 0.000; distinct
      values 2. Sample values: vision, layout.'
    metrics: &id022
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id023
    - layout
    - vision
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  text_length:
    type: integer
    required: true
    description: 'text_length represented as integer. Null fraction 0.000; distinct
      values 221. Sample values: 590, 890, 416. Observed range 1.0 to 1035.0; mean
      121.084356; p25 7.0; p50 51.0; p75 120.5; std 186.995023; p95 581.85; p99 781.8.'
    metrics: &id024
      dtype: int64
      null_fraction: 0.0
      cardinality: 221
      dominant_character_pattern: null
      min: 1.0
      max: 1035.0
      mean: 121.084356
      p25: 7.0
      p50: 51.0
      p75: 120.5
      std: 186.995023
      p95: 581.85
      p99: 781.8
    minimum: 1.0
    maximum: 1035.0
    downstream_consumers:
    - analytics_invoice_quality
    - dbt_week3_extractions_model
  text_preview:
    type: string
    required: true
    description: 'text_preview represented as string. Null fraction 0.000; distinct
      values 410. Sample values: አባሪ 3. የኦዲት ግኝት መረጃ አመላካች


      መረጃ ሰጪው፡- የኢትዮጵያ ኢ..., ወጪ 3

      3.1 ሁኔታ:- በጀት ዓመቱን ሳይጠብቅ ተከፍሎ የተገኘ ሂሳብ

      3..., ከላይ ከተራ ቁጥር 1 እስከ 5 ከተገለጹት በስተቀር በእኛ አስተያ የሂሣ....'
