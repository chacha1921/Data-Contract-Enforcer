      null_fraction: 0.0
      cardinality: 410
      dominant_character_pattern:  AAAAAAAA AA AAAAAAA, AAAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    downstream_consumers:
