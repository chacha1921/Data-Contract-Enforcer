lineage:
  source: outputs/week3/extractions.jsonl
  lineage_snapshot: outputs/week4/lineage_snapshots.jsonl
  registry: contract_registry/subscriptions.yaml
  upstream: []
  downstream:
  - id: week4-cartographer
    description: Confidence drives downstream ranking and a 0.0-1.0 to 0-100 scale
      shift breaks ordering.; Used as the primary identifier in downstream lineage
      and enrichment flows.
    fields_consumed:
    - doc_id
    - extracted_facts
    - source_doc_id
    breaking_if_changed:
    - extracted_facts.confidence
    - doc_id
    validation_mode: ENFORCE
  - id: week7-ai-contract-extension
    description: Prompt-input metadata and AI risk correlation depend on a stable
      document identifier.; Prompt metadata derivation depends on a stable source
      document identifier.; Prompt validation requires stable text preview strings
      for downstream AI checks.; Embedding drift checks depend on extracted fact payload
      text remaining string-compatible.
    fields_consumed:
    - doc_id
    - source_doc_id
    - text_preview
    - extracted_facts.value
    breaking_if_changed:
    - doc_id
    - source_doc_id
    - text_preview
    - extracted_facts.value
    validation_mode: ENFORCE
  downstream_consumers_from_graph:
  - node_id: analytics_invoice_quality
    relationship: LINKED
  - node_id: dbt_week3_extractions_model
    relationship: LINKED
