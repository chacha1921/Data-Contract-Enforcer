kind: DataContract
apiVersion: v3.0.0
dataContractSpecification: 1.1.0
id: week3_extractions
info:
  title: Week 3 Document Refinery — Extraction Records
  version: 1.0.0
  description: One record per processed document containing extracted facts and metadata.
  owner: week3-team
servers:
  local:
    type: local
    path: outputs/week3/extractions.jsonl
    format: jsonl
terms:
  usage: Internal inter-system data contract. Do not publish.
  limitations: confidence must remain in 0.0–1.0 float range.
schema:
  block_id:
    type: string
    required: true
    description: 'Identifier for the extracted page block or OCR segment. Sample values:
      vision_text_1, vision_text_2, vision_text_3.'
    metrics: &id001
      dtype: object
      null_fraction: 0.0
      cardinality: 652
      dominant_character_pattern: AAAAAA_AAAA_99999999999
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
  block_type:
    type: string
    required: true
    description: 'Block classification emitted by the extraction pipeline. Sample
      values: text.'
    metrics: &id002
      dtype: object
      null_fraction: 0.0
      cardinality: 1
      dominant_character_pattern: AAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id003
    - text
  doc_id:
    type: string
    required: true
    description: 'Document identifier for the extracted source document. Sample values:
      2013-E.C-Audit-finding-information, tax_expenditure_ethiopia_2021_22.'
    metrics: &id004
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAA_AAAAAAAAAAA_AAAAAAAA_9999_99
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id005
    - 2013-E.C-Audit-finding-information
    - tax_expenditure_ethiopia_2021_22
  domain_hint:
    type: string
    required: true
    description: 'domain_hint represented as string. Null fraction 0.000; distinct
      values 2. Sample values: general, financial.'
    metrics: &id006
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id007
    - financial
    - general
  language:
    type: string
    required: true
    description: 'Detected language code for the extracted block. Sample values: am,
      en.'
    metrics: &id008
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id009
    - am
    - en
  language_confidence:
    type: number
    required: true
    description: Confidence score. MUST be float 0.0-1.0. 0-100 scale is a breaking
      change.
    metrics: &id010
      dtype: float64
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: null
      min: 0.9
      max: 1.0
      mean: 0.99954
      p25: 1.0
      p50: 1.0
      p75: 1.0
      std: 0.006768
      p95: 1.0
      p99: 1.0
    minimum: 0.0
    maximum: 1.0
  layout_complexity:
    type: string
    required: true
    description: 'layout_complexity represented as string. Null fraction 0.000; distinct
      values 2. Sample values: single_column, table_heavy.'
    metrics: &id011
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAA_AAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id012
    - single_column
    - table_heavy
  origin_type:
    type: string
    required: true
    description: 'origin_type represented as string. Null fraction 0.000; distinct
      values 2. Sample values: scanned_image, native_digital.'
    metrics: &id013
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAAA_AAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id014
    - native_digital
    - scanned_image
  page_number:
    type: integer
    required: true
    description: 'page_number represented as integer. Null fraction 0.000; distinct
      values 60. Sample values: 1, 2, 3. Observed range 1.0 to 60.0; mean 29.455521;
      p25 16.0; p50 29.0; p75 44.0; std 15.604767; p95 56.45; p99 59.0.'
    metrics: &id015
      dtype: int64
      null_fraction: 0.0
      cardinality: 60
      dominant_character_pattern: null
      min: 1.0
      max: 60.0
      mean: 29.455521
      p25: 16.0
      p50: 29.0
      p75: 44.0
      std: 15.604767
      p95: 56.45
      p99: 59.0
    minimum: 1.0
    maximum: 60.0
  processed_at:
    type: string
    required: true
    description: 'processed_at represented as string. Null fraction 0.000; distinct
      values 2. Sample values: 2026-03-07T20:02:37.191264, 2026-03-08T02:29:56.247097.'
    metrics: &id016
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: 9999-99-99A99:99:99.999999
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    format: date-time
  processing_time_seconds:
    type: number
    required: true
    description: 'processing_time_seconds represented as number. Null fraction 0.000;
      distinct values 2. Sample values: 63.7209, 38.539. Observed range 38.539 to
      63.7209; mean 38.654868; p25 38.539; p50 38.539; p75 38.539; std 1.704213; p95
      38.539; p99 38.539.'
    metrics: &id017
      dtype: float64
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: null
      min: 38.539
      max: 63.7209
      mean: 38.654868
      p25: 38.539
      p50: 38.539
      p75: 38.539
      std: 1.704213
      p95: 38.539
      p99: 38.539
    minimum: 38.539
    maximum: 63.7209
  source_doc_id:
    type: string
    required: true
    description: 'Original source document identifier carried into the extraction
      output. Sample values: 2013-E.C-Audit-finding-information, tax_expenditure_ethiopia_2021_22.'
    metrics: &id018
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAA_AAAAAAAAAAA_AAAAAAAA_9999_99
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id019
    - 2013-E.C-Audit-finding-information
    - tax_expenditure_ethiopia_2021_22
  status:
    type: string
    required: true
    description: 'status represented as string. Null fraction 0.000; distinct values
      1. Sample values: success.'
    metrics: &id020
      dtype: object
      null_fraction: 0.0
      cardinality: 1
      dominant_character_pattern: AAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id021
    - success
  strategy_used:
    type: string
    required: true
    description: 'strategy_used represented as string. Null fraction 0.000; distinct
      values 2. Sample values: vision, layout.'
    metrics: &id022
      dtype: object
      null_fraction: 0.0
      cardinality: 2
      dominant_character_pattern: AAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    enum: &id023
    - layout
    - vision
  text_length:
    type: integer
    required: true
    description: 'text_length represented as integer. Null fraction 0.000; distinct
      values 221. Sample values: 590, 890, 416. Observed range 1.0 to 1035.0; mean
      121.084356; p25 7.0; p50 51.0; p75 120.5; std 186.995023; p95 581.85; p99 781.8.'
    metrics: &id024
      dtype: int64
      null_fraction: 0.0
      cardinality: 221
      dominant_character_pattern: null
      min: 1.0
      max: 1035.0
      mean: 121.084356
      p25: 7.0
      p50: 51.0
      p75: 120.5
      std: 186.995023
      p95: 581.85
      p99: 781.8
    minimum: 1.0
    maximum: 1035.0
  text_preview:
    type: string
    required: true
    description: 'text_preview represented as string. Null fraction 0.000; distinct
      values 410. Sample values: አባሪ 3. የኦዲት ግኝት መረጃ አመላካች


      መረጃ ሰጪው፡- የኢትዮጵያ ኢ..., ወጪ 3

      3.1 ሁኔታ:- በጀት ዓመቱን ሳይጠብቅ ተከፍሎ የተገኘ ሂሳብ

      3..., ከላይ ከተራ ቁጥር 1 እስከ 5 ከተገለጹት በስተቀር በእኛ አስተያ የሂሣ....'
    metrics: &id025
      dtype: float64
      null_fraction: 0.0
      cardinality: 410
      dominant_character_pattern:  AAAAAAAA AA AAAAAAA, AAAAAAAA
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
  extracted_facts:
    type: array
    description: 'Collection field extracted_facts exploded for profiling and represented
      as array items. Item fields: confidence, fact_type, value.'
    items: &id026
      type: object
      fields:
      - name: confidence
        type: number
        required: true
        description: Confidence score. MUST be float 0.0-1.0. 0-100 scale is a breaking
          change.
        metrics:
          dtype: float64
          null_fraction: 0.0
          cardinality: 2
          dominant_character_pattern: null
          min: 0.9
          max: 0.95
          mean: 0.90023
          p25: 0.9
          p50: 0.9
          p75: 0.9
          std: 0.003384
          p95: 0.9
          p99: 0.9
        minimum: 0.0
        maximum: 1.0
      - name: fact_type
        type: string
        required: true
        description: 'Semantic type assigned to each extracted fact item. Sample values:
          text_block.'
        metrics:
          dtype: object
          null_fraction: 0.0
          cardinality: 1
          dominant_character_pattern: AAAA_AAAAA
          min: null
          max: null
          mean: null
          std: null
          p95: null
          p99: null
        enum:
        - text_block
      - name: value
        type: string
        required: true
        description: 'Extracted fact payload captured from document content. Sample
          values: አባሪ 3. የኦዲት ግኝት መረጃ አመላካች


          መረጃ ሰጪው፡- የኢትዮጵያ ኢ..., ወጪ 3

          3.1 ሁኔታ:- በጀት ዓመቱን ሳይጠብቅ ተከፍሎ የተገኘ ሂሳብ

          3..., ከላይ ከተራ ቁጥር 1 እስከ 5 ከተገለጹት በስተቀር በእኛ አስተያ የሂሣ....'
        metrics:
          dtype: float64
          null_fraction: 0.0
          cardinality: 410
          dominant_character_pattern:  AAAAAAAA AA AAAAAAA, AAAAAAAA
          min: null
          max: null
          mean: null
          std: null
          p95: null
          p99: null
quality:
  type: SodaChecks
  specification:
    checks for week3_extractions:
    - '- row_count >= 1'
    - '- missing_count(block_id) = 0'
    - '- missing_count(block_type) = 0'
    - '- missing_count(doc_id) = 0'
    - '- missing_count(domain_hint) = 0'
    - '- missing_count(language) = 0'
    - '- missing_count(language_confidence) = 0'
    - '- min(language_confidence) >= 0.0'
    - '- max(language_confidence) <= 1.0'
    - '- missing_count(layout_complexity) = 0'
    - '- missing_count(origin_type) = 0'
    - '- missing_count(page_number) = 0'
    - '- min(page_number) >= 1.0'
    - '- max(page_number) <= 60.0'
    - '- missing_count(processed_at) = 0'
    - '- missing_count(processing_time_seconds) = 0'
    - '- min(processing_time_seconds) >= 38.539'
    - '- max(processing_time_seconds) <= 63.7209'
    - '- missing_count(source_doc_id) = 0'
    - '- missing_count(status) = 0'
    - '- missing_count(strategy_used) = 0'
    - '- missing_count(text_length) = 0'
    - '- min(text_length) >= 1.0'
    - '- max(text_length) <= 1035.0'
    - '- missing_count(text_preview) = 0'
    - '- missing_count(extracted_facts__confidence) = 0'
    - '- min(extracted_facts__confidence) >= 0.0'
    - '- max(extracted_facts__confidence) <= 1.0'
    - '- missing_count(extracted_facts__fact_type) = 0'
    - '- missing_count(extracted_facts__value) = 0'
lineage:
  source: outputs/week3/extractions.jsonl
  lineage_snapshot: outputs/week4/lineage_snapshots.jsonl
  registry: contract_registry/subscriptions.yaml
  registry_subscribers_source: contract_registry/subscriptions.yaml
  downstream_nodes_from_lineage_source: outputs/week4/lineage_snapshots.jsonl
  downstream_nodes_from_lineage:
  - node_id: analytics_invoice_quality
    relationship: LINKED
  - node_id: dbt_week3_extractions_model
    relationship: LINKED
  registry_subscribers:
  - week4_cartographer
  - week6_contract_enforcer
  note: registry_subscribers come from subscriptions.yaml and drive blast-radius decisions.
    downstream_nodes_from_lineage come from the Week 4 lineage snapshot and are enrichment
    only.
llm_annotations:
- field: status
  description: 'status represented as string. Null fraction 0.000; distinct values
    1. Sample values: success.'
  business_rule: status must remain semantically consistent within contract week3_extractions.
  cross_column_relationship: Review alongside sibling metadata fields during manual
    review.
- field: extracted_facts__value
  description: 'Extracted fact payload captured from document content. Sample values:
    አባሪ 3. የኦዲት ግኝት መረጃ አመላካች


    መረጃ ሰጪው፡- የኢትዮጵያ ኢ..., ወጪ 3

