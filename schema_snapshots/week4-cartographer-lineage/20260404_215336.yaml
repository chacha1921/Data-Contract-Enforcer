kind: DataContract
apiVersion: v3.0.0
dataContractSpecification: 1.1.0
id: week4-cartographer-lineage
info:
  title: Week 4 Cartographer — Lineage Snapshots
  version: 1.0.0
  description: Lineage graph snapshots used for downstream impact analysis and blast-radius
    enrichment.
  owner: week4-team
servers:
  local:
    type: local
    path: outputs/week4/lineage_snapshots.jsonl
    format: jsonl
terms:
  usage: Internal lineage enrichment contract.
  limitations: Edge source and target identifiers must remain stable between snapshots.
schema:
  captured_at:
    type: string
    required: true
    description: 'captured_at represented as string. Null fraction 0.000; distinct
      values 1. Sample values: 2026-04-04T19:40:26.094009Z.'
    metrics: &id001
      dtype: object
      null_fraction: 0.0
      cardinality: 1
      dominant_character_pattern: 9999-99-99A99:99:99.999999A
      min: null
      max: null
      mean: null
      std: null
      p95: null
      p99: null
    format: date-time
    downstream_consumers:
    - week7-violation-attributor
  edges:
    type: array
    description: 'Collection field edges exploded for profiling and represented as
      array items. Item fields: source, target.'
    items:
      source:
        type: string
        required: true
        description: 'source represented as string. Null fraction 0.000; distinct
          values 2. Sample values: week3_extractions, week5_events.'
        metrics: &id002
          dtype: object
          null_fraction: 0.0
          cardinality: 2
          dominant_character_pattern: AAAA9_AAAAAAAAAAA
          min: null
          max: null
          mean: null
          std: null
          p95: null
          p99: null
        enum: &id003
        - week3_extractions
        - week5_events
      target:
        type: string
        required: true
        description: 'target represented as string. Null fraction 0.000; distinct
          values 4. Sample values: analytics_invoice_quality, dbt_week3_extractions_model,
          operations_event_dashboard.'
        metrics: &id004
          dtype: object
          null_fraction: 0.0
          cardinality: 4
          dominant_character_pattern: AAAAAAAAA_AAAAAAA_AAAAAAA
          min: null
          max: null
          mean: null
          std: null
          p95: null
          p99: null
        enum: &id005
        - analytics_invoice_quality
        - dbt_week3_extractions_model
        - dbt_week5_events_model
        - operations_event_dashboard
quality:
  type: SodaChecks
  specification:
    checks for lineage_snapshots:
    - '- row_count >= 1'
    - '- missing_count(captured_at) = 0'
    - '- missing_count(edges__source) = 0'
    - '- missing_count(edges__target) = 0'
lineage:
  source: outputs/week4/lineage_snapshots.jsonl
  lineage_snapshot: outputs/week4/lineage_snapshots.jsonl
  registry: contract_registry/subscriptions.yaml
  upstream: []
  downstream:
  - id: week7-violation-attributor
    description: Blast-radius enrichment depends on stable downstream node identities.;
      Upstream-to-downstream traversal depends on stable lineage edge sources.
    fields_consumed:
    - captured_at
    - edges.source
    - edges.target
    breaking_if_changed:
    - edges.target
    - edges.source
    validation_mode: AUDIT
  downstream_consumers_from_graph: []
profiling: {}
llm_annotations:
- field: edges__source
  plain_english_description: 'source represented as string. Null fraction 0.000; distinct
    values 2. Sample values: week3_extractions, week5_events.'
  validation_expression: edges__source must remain semantically consistent within
    contract week4-cartographer-lineage.
  cross_column_relationship: Review alongside adjacent metadata columns during contract
    review.
  source: heuristic_fallback
- field: edges__target
  plain_english_description: 'target represented as string. Null fraction 0.000; distinct
    values 4. Sample values: analytics_invoice_quality, dbt_week3_extractions_model,
    operations_event_dashboard.'
  validation_expression: edges__target must remain semantically consistent within
    contract week4-cartographer-lineage.
  cross_column_relationship: Review alongside adjacent metadata columns during contract
    review.
  source: heuristic_fallback
models:
- name: lineage_snapshots
  type: table
  fields:
  - name: captured_at
    type: string
    required: true
    description: 'captured_at represented as string. Null fraction 0.000; distinct
      values 1. Sample values: 2026-04-04T19:40:26.094009Z.'
    metrics: *id001
    format: date-time
  - name: edges
    type: array
    description: 'Collection field edges exploded for profiling and represented as
      array items. Item fields: source, target.'
    items:
      type: object
      fields:
      - name: source
        type: string
        required: true
        description: 'source represented as string. Null fraction 0.000; distinct
          values 2. Sample values: week3_extractions, week5_events.'
        metrics: *id002
        enum: *id003
      - name: target
        type: string
        required: true
        description: 'target represented as string. Null fraction 0.000; distinct
          values 4. Sample values: analytics_invoice_quality, dbt_week3_extractions_model,
          operations_event_dashboard.'
        metrics: *id004
        enum: *id005
