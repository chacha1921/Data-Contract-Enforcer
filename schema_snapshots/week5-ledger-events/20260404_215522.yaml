quality:
  type: SodaChecks
  specification:
    checks for events:
    - '- row_count >= 1'
    - '- missing_count(aggregate_id) = 0'
    - '- missing_count(aggregate_type) = 0'
    - '- missing_count(event_id) = 0'
    - '- missing_count(event_type) = 0'
    - '- missing_count(event_version) = 0'
    - '- min(event_version) >= 1.0'
    - '- max(event_version) <= 2.0'
    - '- missing_count(occurred_at) = 0'
    - '- missing_count(recorded_at) = 0'
    - '- min(requested_amount_usd) >= 247000.0'
    - '- max(requested_amount_usd) <= 6349000.0'
    - '- missing_count(sequence_number) = 0'
    - '- min(sequence_number) >= 1.0'
    - '- max(sequence_number) <= 13.0'
    - '- missing_count(source_system) = 0'
lineage:
  source: outputs/week5/events.jsonl
  lineage_snapshot: outputs/week4/lineage_snapshots.jsonl
  registry: contract_registry/subscriptions.yaml
  upstream: []
  downstream:
  - id: week7-schema-contract
    description: Event-routing and contract clauses depend on stable event taxonomy.;
      Consumer event validation depends on stable event schema versions.; Temporal
      validation and lineage attribution rely on event timestamps.
    fields_consumed:
    - event_id
    - aggregate_id
    - event_type
    - occurred_at
    - event_version
    breaking_if_changed:
    - event_type
    - event_version
    - occurred_at
    validation_mode: ENFORCE
  downstream_consumers_from_graph:
  - node_id: operations_event_dashboard
    relationship: LINKED
  - node_id: dbt_week5_events_model
    relationship: LINKED
